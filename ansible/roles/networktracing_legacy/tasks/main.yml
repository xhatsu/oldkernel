---
- name: Stage self-contained bundle on managed host
  ansible.builtin.raw: >
    test -s {{ nt_bundle_dest }} || curl -sSf {{ nt_bundle_url }} -o {{ nt_bundle_dest }} && chmod 750 {{ nt_bundle_dest }}
  changed_when: false

- name: Write desired configuration manifest
  ansible.builtin.raw: |
    cat << 'CONF' > {{ nt_desired_dest }}
    version={{ nt_agent_version }}
    hub={{ nt_hub_url }}
    iface={{ nt_capture_iface }}
    ports={{ nt_capture_ports }}
    mode={{ nt_capture_mode }}
    wsse_bytes={{ nt_wsse_bytes }}
    ship_threads={{ nt_ship_threads }}
    ship_rate_kbps={{ nt_ship_rate_kbps }}
    stats_interval_sec={{ nt_stats_interval_sec }}
    CONF
    chmod 600 {{ nt_desired_dest }}
  changed_when: false

- name: Inspect deployed configuration stamp and service health
  ansible.builtin.raw: |
    STAMP_MATCH=0
    if [ -f {{ nt_deployed_stamp }} ] && cmp -s {{ nt_desired_dest }} {{ nt_deployed_stamp }}; then
        STAMP_MATCH=1
    fi
    SVC_RUNNING=0
    if /etc/init.d/networktracing-legacy status 2>/dev/null | grep -q "running"; then
        SVC_RUNNING=1
    fi
    echo "STAMP_MATCH=$STAMP_MATCH SVC_RUNNING=$SVC_RUNNING"
  register: nt_eval_raw
  changed_when: false

- name: Evaluate installation requirement
  ansible.builtin.set_fact:
    nt_install_required: "{{ ('STAMP_MATCH=1 SVC_RUNNING=1' not in nt_eval_raw.stdout) }}"

- name: Preflight check before modifying host
  ansible.builtin.raw: >
    sh {{ nt_bundle_dest }} --check
    --mode {{ nt_capture_mode }}
    --server {{ nt_hub_url }}
    --iface {{ nt_capture_iface }}
    --ports {{ nt_capture_ports }}
  when: nt_install_required | bool
  changed_when: false

- name: Install NetworkTracing agent with fail-closed safeguards
  ansible.builtin.raw: >
    sh {{ nt_bundle_dest }} --offline
    --mode {{ nt_capture_mode }}
    --server {{ nt_hub_url }}
    --iface {{ nt_capture_iface }}
    --ports {{ nt_capture_ports }}
    --wsse-bytes {{ nt_wsse_bytes }}
    --ship-threads {{ nt_ship_threads }}
    --ship-rate-kbps {{ nt_ship_rate_kbps }}
    --stats-interval-sec {{ nt_stats_interval_sec }}
  when: nt_install_required | bool

- name: Record configuration stamp upon successful install
  ansible.builtin.raw: >
    cp -f {{ nt_desired_dest }} {{ nt_deployed_stamp }} && chmod 600 {{ nt_deployed_stamp }}
  when: nt_install_required | bool

- name: Verify running capture daemon
  ansible.builtin.raw: /etc/init.d/networktracing-legacy status
  register: nt_final_status
  changed_when: false

- name: Display service status
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} service status: {{ nt_final_status.stdout.strip() }}"
