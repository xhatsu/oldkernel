---
- name: Verify NetworkTracing Legacy Agent Fleet Health
  hosts: legacy_capture
  become: true

  tasks:
    - name: Query SysV service status
      ansible.builtin.command:
        argv:
          - /etc/init.d/networktracing-legacy
          - status
      register: nt_status_cmd
      changed_when: false

    - name: Query running processes
      ansible.builtin.shell: |
        ps -eo pid,user,comm,pri,ni,stat,cls,rss,vsz,args | grep -E 'nt-sniff|nt-ship|python-capnetraw' | grep -v grep || true
      register: nt_proc_cmd
      changed_when: false

    - name: Display service and process health
      ansible.builtin.debug:
        msg:
          - "Service Status: {{ nt_status_cmd.stdout_lines | default([]) }}"
          - "Processes: {{ nt_proc_cmd.stdout_lines | default([]) }}"
