---
- name: Verify NetworkTracing Legacy Agent Fleet Health
  hosts: legacy_capture
  gather_facts: false
  become: true

  tasks:
    - name: Query SysV service status
      ansible.builtin.raw: /etc/init.d/networktracing-legacy status 2>&1 || true
      register: nt_status_cmd

    - name: Query running processes
      ansible.builtin.raw: ps -eo pid,user,comm,pri,ni,stat,cls,rss,vsz,args | grep -E 'nt-sniff|nt-ship|python-capnetraw' | grep -v grep || true
      register: nt_proc_cmd

    - name: Display service and process health
      ansible.builtin.debug:
        msg:
          - "Service Status: {{ nt_status_cmd.stdout.strip() }}"
          - "Processes: {{ nt_proc_cmd.stdout_lines | default([]) }}"
