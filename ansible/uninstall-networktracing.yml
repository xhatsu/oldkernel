---
- name: Uninstall NetworkTracing Legacy Agent from Fleet
  hosts: legacy_capture
  become: true
  gather_facts: false
  serial: "25%"

  tasks:
    - name: Stop and uninstall service
      ansible.builtin.raw: /etc/init.d/networktracing-legacy uninstall || true
      changed_when: false

    - name: Remove deployment stamp
      ansible.builtin.raw: rm -f /etc/networktracing-legacy.deploy

    - name: Clean temporary installer bundle
      ansible.builtin.raw: rm -f /var/tmp/install-firstrun-el68.sh
