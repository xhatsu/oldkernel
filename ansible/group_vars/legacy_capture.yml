---
# Default configuration for legacy capture fleet
nt_agent_version: "2026-09-16-otlp-collector-v2"
# In hub mode this is the Hub base URL. In otlp mode it is the Collector OTLP/
# HTTP base URL; the agent appends /v1/traces.
nt_hub_url: "http://192.168.122.1:4318"
nt_export_mode: "otlp" # hub or otlp
nt_trusted_proxy_cidrs: "" # e.g. "10.0.0.0/8,192.168.0.0/16"; empty = never trust XFF
# Capture networking
nt_capture_iface: "eth0"
nt_capture_ports: "80,8003,8005,8010"

# Mode: 'python' (compatible with stock el68), 'hybrid', or 'cpp'
nt_capture_mode: "cpp"

# Payload, rate and telemetry bounds
nt_wsse_bytes: "1024"
nt_ship_threads: "4"
nt_ship_rate_kbps: "8000"
nt_stats_interval_sec: "30"

# Remote filesystem staging
nt_bundle_dest: "/var/tmp/install-firstrun-el68.sh"
nt_desired_dest: "/var/tmp/networktracing-legacy.desired"
nt_deployed_stamp: "/etc/networktracing-legacy.deploy"
